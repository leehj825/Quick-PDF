name: Debug APK pre-release

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-9s5yp5]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="v${VERSION}-debug.${GITHUB_RUN_NUMBER}"
          APK="QuickPDF-${VERSION}-debug-${SHORT}.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "QuickPDF ${VERSION} debug (${SHORT})" \
            --notes "Debug APK (unsigned release key, test AdMob IDs). Build #${GITHUB_RUN_NUMBER}, commit ${SHORT}."
