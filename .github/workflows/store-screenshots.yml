name: Store screenshots (real app on emulator)

# Runs the real app on an Android emulator (integration_test), takes screenshots while it is
# operated, and uploads the PNGs to a pre-release. Nothing here is shipped to users.
on:
  workflow_dispatch:
  push:
    paths:
      - 'integration_test/**'
      - 'test_driver/**'
      - '.github/workflows/store-screenshots.yml'
      - 'tool/store/embed_samples.py'
      - 'tool/store/make_samples.py'

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Fictional sample documents -> integration_test/sample_data.dart
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter || true
          pip install --quiet pillow
          python3 tool/store/make_samples.py build/store/samples
          python3 tool/store/embed_samples.py

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the real app on the emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/store_screenshots_test.dart -d emulator-5554

      - name: Upload screenshots to a pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la build/store/device || { echo "no screenshots were produced"; exit 1; }
          TAG="store-shots-${GITHUB_RUN_NUMBER}"
          ok=
          for i in 1 2 3 4; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" build/store/device/*.png --clobber && ok=1 && break
            else
              gh release create "$TAG" build/store/device/*.png --target "$GITHUB_SHA" --prerelease \
                --title "Store screenshots (real app, emulator) #${GITHUB_RUN_NUMBER}" \
                --notes "Real screenshots of the app running on an Android 14 emulator (Pixel 6). Not an app build." && ok=1 && break
            fi
            echo "attempt $i failed; retrying in $((i * 20))s"; sleep $((i * 20))
          done
          [ -n "$ok" ]
