name: Diagnose launch crash (emulator)

# Builds the release APK for x86_64, launches it on an emulator and prints the crash log.
# Diagnostic only: nothing is published.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diagnose-launch.yml']

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get

      - name: Allow x86_64 for the emulator build (not committed)
        run: sed -i 's/listOf("arm64-v8a", "armeabi-v7a")/listOf("arm64-v8a", "armeabi-v7a", "x86_64")/' android/app/build.gradle.kts

      - run: flutter build apk --release --target-platform android-x64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator and collect logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p app.quickpdf.quick_pdf -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "=== process alive? ==="
            adb shell pidof app.quickpdf.quick_pdf || echo "NOT RUNNING"
            adb logcat -d > logcat.txt
            echo "=== crash summary ==="
            grep -E -n "FATAL EXCEPTION|Fatal signal|UnsatisfiedLinkError|ClassNotFoundException|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|AbstractMethodError|Process: app.quickpdf|Force finishing|ANR in|Exception in thread|F/libc|F DEBUG" logcat.txt | head -60 || true
            echo "=== context around first fatal ==="
            grep -n -m1 -E "FATAL EXCEPTION|Fatal signal" logcat.txt | cut -d: -f1 | while read n; do sed -n "$((n-3)),$((n+40))p" logcat.txt; done
            echo "=== flutter / app tagged lines ==="
            grep -E "flutter|quick_pdf|quickpdf" logcat.txt | tail -40
